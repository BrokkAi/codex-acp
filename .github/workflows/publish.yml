name: Publish BrokkAi adapter
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to retry
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-adapter
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify package and tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (p.name !== '@brokkai/codex-acp' || process.env.RELEASE_TAG !== `v${p.version}`) throw new Error('Release tag must match the BrokkAi package version');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${p.version}\n`);
          JS
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: brokkai-codex-acp-*.tgz
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
      - name: Publish exact tested tarball
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          npm install --global npm@11
          if npm view "@brokkai/codex-acp@$VERSION" version; then
            echo 'Version already published; continuing release recovery.'
          else
            npm publish "brokkai-codex-acp-$VERSION.tgz" --access public --provenance
          fi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG"; then
            gh release create "$RELEASE_TAG" "brokkai-codex-acp-$VERSION.tgz" --verify-tag --generate-notes
          fi
